<!DOCTYPE html>
<!--
  Main Podcast Cover Art (for Apple Podcasts, Spotify, etc.)
  Dimensions: 3000x3000 (Apple requires min 1400x1400, recommends 3000x3000)
  Screenshot this at native resolution for submission
-->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 3000px;
    height: 3000px;
    background: #0a0a0a;
    font-family: 'Arial', 'Helvetica Neue', sans-serif;
    overflow: hidden;
  }
  .container {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
  }
  .top-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 30px;
    background: linear-gradient(90deg, #c2410c, #ea580c, #c2410c);
  }
  .bottom-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 30px;
    background: linear-gradient(90deg, #c2410c, #ea580c, #c2410c);
  }
  .border-frame {
    position: absolute;
    inset: 100px;
    border: 3px solid #1a1a1a;
  }
  .big-r {
    color: #141414;
    font-size: 1200px;
    font-weight: 900;
    line-height: 1;
    position: absolute;
    opacity: 0.5;
  }
  .title-line1 {
    color: #e5e5e5;
    font-size: 200px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 10px;
    z-index: 1;
  }
  .title-line2 {
    color: #c2410c;
    font-size: 140px;
    font-weight: 300;
    text-transform: lowercase;
    letter-spacing: 5px;
    margin-bottom: 20px;
    z-index: 1;
  }
  .title-line3 {
    color: #e5e5e5;
    font-size: 200px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 10px;
    margin-bottom: 100px;
    z-index: 1;
  }
  .host {
    color: #525252;
    font-size: 56px;
    letter-spacing: 14px;
    text-transform: uppercase;
    z-index: 1;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="top-bar"></div>
    <div class="bottom-bar"></div>
    <div class="border-frame"></div>
    <div class="big-r">R</div>
    <div class="title-line1">Rebuilding</div>
    <div class="title-line2">a</div>
    <div class="title-line3">Broken Man</div>
    <div class="host">John Sobetsky</div>
  </div>
</body>
</html>
