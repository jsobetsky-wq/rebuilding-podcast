<!DOCTYPE html>
<!--
  YouTube Thumbnail Generator
  Dimensions: 1280x720 (YouTube standard)
  Open in browser → Edit text → Screenshot
-->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1280px;
    height: 720px;
    background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
    font-family: 'Arial', 'Helvetica Neue', sans-serif;
    overflow: hidden;
  }
  .container {
    width: 100%;
    height: 100%;
    display: flex;
    position: relative;
  }
  .left {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 60px 80px;
  }
  .right {
    width: 360px;
    background: linear-gradient(180deg, #c2410c 0%, #7c2d12 100%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  .ep-badge {
    background: #c2410c;
    color: white;
    font-size: 16px;
    font-weight: 700;
    padding: 8px 20px;
    border-radius: 4px;
    display: inline-block;
    margin-bottom: 24px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .title {
    color: white;
    font-size: 56px;
    font-weight: 900;
    line-height: 1.15;
    margin-bottom: 20px;
    text-transform: uppercase;
  }
  .subtitle {
    color: #a3a3a3;
    font-size: 20px;
    line-height: 1.5;
    max-width: 500px;
  }
  .right-text {
    color: white;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-size: 18px;
    letter-spacing: 8px;
    text-transform: uppercase;
    font-weight: 700;
    opacity: 0.6;
  }
  .big-r {
    color: white;
    font-size: 180px;
    font-weight: 900;
    opacity: 0.15;
    position: absolute;
    right: 60px;
    top: -20px;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="left">
      <!-- === EDIT THESE === -->
      <div class="ep-badge">Episode 01</div>
      <div class="title">Why I'm<br>Here</div>
      <div class="subtitle">The first episode. What broke, and what I'm trying to rebuild.</div>
      <!-- ================== -->
    </div>
    <div class="right">
      <div class="big-r">R</div>
      <div class="right-text">Rebuilding a Broken Man</div>
    </div>
  </div>
</body>
</html>
