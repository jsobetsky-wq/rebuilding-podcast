<!DOCTYPE html>
<!--
  Episode Cover Art Generator
  Open in Chrome → Edit the episode number and title below → Screenshot at 3000x3000
  Or use a screenshot tool to capture at 1:1 ratio

  For automated generation, use Puppeteer or playwright to screenshot this page.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 3000px;
    height: 3000px;
    background: #0a0a0a;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-family: 'Arial', 'Helvetica Neue', sans-serif;
    overflow: hidden;
  }
  .container {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 200px;
    position: relative;
  }
  .accent-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 24px;
    background: linear-gradient(90deg, #c2410c, #ea580c, #c2410c);
  }
  .podcast-name {
    color: #c2410c;
    font-size: 64px;
    letter-spacing: 12px;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 120px;
  }
  .ep-number {
    color: #404040;
    font-size: 320px;
    font-weight: 900;
    line-height: 1;
    margin-bottom: 60px;
    letter-spacing: -10px;
  }
  .ep-title {
    color: #e5e5e5;
    font-size: 120px;
    font-weight: 700;
    text-align: center;
    line-height: 1.2;
    max-width: 2200px;
    margin-bottom: 120px;
  }
  .host {
    color: #525252;
    font-size: 48px;
    letter-spacing: 6px;
    text-transform: uppercase;
  }
  .border-frame {
    position: absolute;
    inset: 60px;
    border: 2px solid #1a1a1a;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="accent-bar"></div>
    <div class="border-frame"></div>
    <div class="podcast-name">Rebuilding a Broken Man</div>

    <!-- === EDIT THESE === -->
    <div class="ep-number">01</div>
    <div class="ep-title">Why I'm Here</div>
    <!-- ================== -->

    <div class="host">John Sobetsky</div>
  </div>
</body>
</html>
